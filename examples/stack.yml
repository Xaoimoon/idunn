# Example stack: docker stack deploy -c stack.yml idunn
#
# Iðunn switches by itself to an unprivileged user with the Docker socket's
# group: no user or group to set here.
services:
  idunn:
    image: idunn:latest # use your registry path, ideally pinned as tag@digest
    read_only: true
    environment:
      TZ: UTC
      # IDUNN_SCHEDULE: "0 0 * * * *"   # every hour (default)
      # IDUNN_BLACKOUT: "01:00-05:00"   # no update during the night
      # IDUNN_MIN_AGE: "6h"             # wait before applying a new image
      # IDUNN_MONITOR_ONLY: "true"      # detect and notify only
      # IDUNN_VERSION_CHECK: "true"     # daily report of newer version tags
      # IDUNN_SELF_UPDATE: "true"       # let Iðunn update its own service
      # IDUNN_METRICS_ADDR: ":9640"     # Prometheus metrics, keep the port internal
      IDUNN_NOTIFICATION_URL_FILE: /run/secrets/idunn_notification_url
    secrets:
      - idunn_notification_url
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      # One instance per manager; only the Raft leader acts.
      mode: global
      placement:
        constraints:
          - node.role == manager
      labels:
        # Upgraded by redeploying this stack, or set IDUNN_SELF_UPDATE=true (and
        # failure_action: rollback below) to let Iðunn update itself.
        idunn.enable: "false"
      restart_policy:
        condition: any
      update_config:
        order: stop-first
        failure_action: rollback # undoes a self-update whose new version fails to start
      resources:
        limits:
          memory: 64M

  # Any service opts in with a deploy label.
  whoami:
    image: traefik/whoami:latest
    deploy:
      labels:
        idunn.enable: "true"

secrets:
  idunn_notification_url:
    # printf 'discord://token@webhookid' | docker secret create idunn_notification_url -
    external: true
