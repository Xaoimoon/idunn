name: CI

# GitHub counterpart of .forgejo/workflows/ci.yml. Tests on every push and
# pull request, including the integration tests; on main and on version tags,
# also builds the linux/amd64 + linux/arm64 image and pushes it to the GitHub
# Container Registry. A version tag also creates a GitHub release whose notes
# are the tag message.
#
# Repository settings (Settings > Secrets and variables > Actions):
# - variable PUBLISH = "true" to build and push the image and create releases
#   (leave it unset on forks and mirrors)
# - variable IMAGE (optional), defaults to ghcr.io/<owner>/<repository>
# No secret is needed: the workflow's GITHUB_TOKEN pushes to ghcr.io.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./...

      - name: Vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Integration tests
        run: sh scripts/integration.sh

  image:
    needs: [test, integration]
    if: ${{ vars.PUBLISH == 'true' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Tags
        env:
          IMAGE: ${{ vars.IMAGE }}
        run: |
          image=${IMAGE:-ghcr.io/$GITHUB_REPOSITORY}
          image=$(echo "$image" | tr '[:upper:]' '[:lower:]')
          short=$(echo "$GITHUB_SHA" | cut -c1-12)
          case "$GITHUB_REF" in
            refs/tags/v*) version=$GITHUB_REF_NAME; tags="$image:$version,$image:latest" ;;
            *) version=main-$short; tags="$image:main,$image:$short" ;;
          esac
          {
            echo "REGISTRY=${image%%/*}"
            echo "VERSION=$version"
            echo "TAGS=$tags"
          } >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Dockerfile cross-compiles on the build platform: no QEMU needed.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ env.VERSION }}
          tags: ${{ env.TAGS }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
          push: true

      - name: Digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "Pushed $VERSION as $DIGEST"

  release:
    needs: image
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # actions/checkout turns the tag into a lightweight one: fetch the
      # annotated tag again so that its message becomes the release notes.
      - name: Fetch the tag
        run: git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --notes-from-tag --title "$GITHUB_REF_NAME"
